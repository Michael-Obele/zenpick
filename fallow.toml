# Per-issue-type severity: "error" (fail CI), "warn" (report only), "off" (ignore)
[rules]
# Vite bundles every import at build time (adapter-auto static output), so
# runtime packages living in devDependencies is a working convention here —
# node_modules is never deployed. Keep the rule visible but non-blocking.
dev-dependencies-in-production = "warn"

[regression.baseline]
totalIssues = 14
unusedFiles = 0
unusedExports = 0
unusedTypes = 0
unusedDependencies = 0
unusedDevDependencies = 0
unusedOptionalDependencies = 0
unusedEnumMembers = 0
unusedClassMembers = 0
unresolvedImports = 0
unlistedDependencies = 0
duplicateExports = 0
circularDependencies = 0
typeOnlyDependencies = 0
testOnlyDependencies = 0
devDependenciesInProduction = 14
