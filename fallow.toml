# fallow.toml - Codebase analysis configuration
# See https://docs.fallow.tools for documentation

# SvelteKit entry points: route files and the lib barrel are loaded by the framework.
entry = ["src/routes/**/*.{ts,svelte}", "src/lib/**/*.ts"]

# Exclude generated shadcn-svelte UI primitives from all analysis (dead code,
# duplicates, health, etc.) — these are CLI-managed and follow their own conventions.
ignorePatterns = ["src/lib/components/ui/**/*.{ts,svelte}"]

# Deps consumed only by the excluded ui/ folder (shadcn-svelte ecosystem) —
# fallow can't see their imports, so without this they'd be false positives.
ignoreDependencies = ["mode-watcher", "tailwind-variants", "vaul-svelte"]

[duplicates]
# Hide pair-only clones; focus on widespread copy-paste worth refactoring.
# Lower to 2 to report every duplicate pair.
minOccurrences = 3

[health]
# CRAP is inflated when fallow estimates 0% coverage (no test suite yet).
maxCrap = 160.0

# Known-safe functions where CRAP is inflated by coverage-blind estimation.
# Each override caps CRAP (and the cyc/cog ceilings where those also exceed
# the global 20/15) at the function's CURRENT score, so the finding stays
# advisory but ANY growth in these functions re-flags. Everything else keeps
# the global thresholds.
[[health.thresholdOverrides]]
files = ["src/lib/server/inference.ts"]
functions = ["inferModel", "inferMigrationHints"]
maxCyclomatic = 41
maxCognitive = 22
maxCrap = 2000.0
reason = "Catalog parser/rewriter — branching is data-driven, coverage-blind"

[[health.thresholdOverrides]]
files = ["src/lib/server/go-docs.ts"]
functions = ["refreshGoDocsData"]
maxCyclomatic = 26
