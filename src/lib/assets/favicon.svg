<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
    <title>ZenPick</title>
    <desc>A continuous ascending Z-shaped receipt with an amber arrowhead and coin, representing AI model price comparison and optimal selection.</desc>
    
    <!-- Background Tile -->
    <rect width="64" height="64" rx="14" fill="#171717" />
    
    <!-- Receipt & Trending Signal (Ascending Z) -->
    <path d="M 10 54 L 42 54 L 10 18 L 42 18" 
          stroke="#f5f5f5" 
          stroke-width="8" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          fill="none" />
    
    <!-- Selection Arrowhead -->
    <polygon points="42,18 50,14 42,10" fill="#f59e0b" />
    
    <!-- Coin (Price Focus) -->
    <circle cx="46" cy="14" r="9" fill="#f59e0b" />
    
    <!-- Dollar Sign (Inside Coin) -->
    <path d="M 46 10 L 46 18 M 42 12 L 50 12 M 42 16 L 50 16" 
          stroke="#171717" 
          stroke-width="2" 
          stroke-linecap="round" 
          fill="none" />
</svg>